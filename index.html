<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearify — Event Control Center</title>
  <meta name="description" content="Create Nearify events, generate QR codes, and manage your event network." />

  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://nearify.org/" />
  <meta property="og:title"       content="Nearify — Event Control Center" />
  <meta property="og:description" content="Create events, generate QR codes, and manage your Nearify event network." />
  <meta property="og:image"       content="https://nearify.org/assets/images/og-default.png" />
  <meta name="twitter:card"       content="summary_large_image" />
  <meta name="twitter:title"      content="Nearify — Event Control Center" />
  <meta name="twitter:description" content="Create events, generate QR codes, and manage your Nearify event network." />
  <meta name="twitter:image"      content="https://nearify.org/assets/images/og-default.png" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="cc-page">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="nav-container">
    <header class="nav">
      <div class="logo">Nearify</div>
      <div class="nav-links">
        <!-- navAuth.js injects the signed-in user pill here -->
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>
    <nav class="nav-drawer" id="navDrawer" aria-label="Site navigation">
      <a href="events/index.html">Public Events</a>
      <a href="admin/event-setup.html" class="nav-drawer-highlight">Advanced Setup</a>
    </nav>
  </div>

  <main id="main-content">

    <!-- ─── LOGGED-OUT LANDING ─────────────────────────────────────────── -->
    <section id="landingView" class="cc-landing" aria-label="Create a Nearify event">
      <div class="cc-landing-inner">
        <h1>Create a Nearify event</h1>
        <p>Generate a QR code your guests scan to join the live network.</p>
        <div class="hero-actions" style="justify-content:center;">
          <button id="landingSignInBtn" class="btn primary">Sign In to Create</button>
        </div>
      </div>
    </section>

    <!-- ─── LOGGED-IN DASHBOARD ───────────────────────────────────────── -->
    <div id="dashboardView" style="display:none;">
      <div class="cc-dashboard">

        <div class="cc-dashboard-header">
          <h1 class="cc-dashboard-title">Events</h1>
          <button id="openCreateModalBtn" class="btn primary">+ Create Event</button>
        </div>

        <!-- Event cards rendered by dashboard.js -->
        <div id="eventCardList" class="cc-event-list" aria-live="polite" aria-label="Your events"></div>

      </div>
    </div>

  </main>

  <!-- ─── CREATE EVENT MODAL ────────────────────────────────────────────── -->
  <div id="createEventModal" class="cc-modal-overlay" hidden>
    <div class="cc-modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">

      <div class="cc-modal-header">
        <h2 id="createModalTitle">Create Event</h2>
        <button id="closeCreateModalBtn" class="cc-modal-close" aria-label="Close">×</button>
      </div>

      <form id="createEventForm" class="cc-modal-form" novalidate>

        <div class="form-row">
          <label for="ceEventName">Event name <span class="field-required" aria-hidden="true">*</span></label>
          <input
            id="ceEventName"
            type="text"
            placeholder="My Meetup"
            autocomplete="off"
            required
            aria-required="true"
            aria-describedby="ceEventNameError"
          />
          <p class="field-error" id="ceEventNameError" role="alert" style="display:none;">Event name is required.</p>
        </div>

        <div class="form-row two-up">
          <div>
            <label for="ceDate">Date</label>
            <input id="ceDate" type="date" />
          </div>
          <div>
            <label for="ceTime">Time</label>
            <input id="ceTime" type="time" />
          </div>
        </div>

        <div class="form-row">
          <label for="ceLocation">Location</label>
          <input id="ceLocation" type="text" placeholder="Venue or address" autocomplete="off" />
        </div>

        <div class="form-row">
          <label for="ceDescription">Description</label>
          <textarea id="ceDescription" rows="3" placeholder="Optional"></textarea>
        </div>

        <div class="cc-modal-actions">
          <button type="submit" id="createEventSubmitBtn" class="btn primary">Create Event</button>
        </div>

        <p id="createEventStatus" class="field-help" aria-live="polite" style="margin-top:10px;"></p>

      </form>
    </div>
  </div>

  <!-- ─── QR MODAL ──────────────────────────────────────────────────────── -->
  <div id="qrModal" class="cc-modal-overlay" hidden>
    <div class="cc-modal cc-qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">

      <button id="closeQrModalBtn" class="cc-modal-close" aria-label="Close">×</button>

      <div class="cc-qr-event-name" id="qrModalTitle"></div>

      <div class="cc-qr-shell">
        <div id="qrModalQrCode"></div>
      </div>

      <p class="cc-qr-subtext">Scan when you arrive to join the live network</p>

      <div class="cc-qr-actions">
        <button id="qrModalCopyBtn" class="btn primary">Copy Link</button>
        <button id="qrModalCloseBtn" class="btn secondary">Close</button>
      </div>

    </div>
  </div>

  <footer class="footer">
    <nav class="footer-links">
      <a href="events/index.html">Public Events</a>
      <a href="admin/event-setup.html">Advanced Setup</a>
      <a href="mailto:hello@nearify.org">Contact</a>
    </nav>
    <p>© 2026 Nearify</p>
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>

  <!-- QR code library (must load before dashboard.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module" src="/assets/js/dashboard.js"></script>
  <script type="module" src="/assets/js/navAuth.js"></script>

</body>
</html>
